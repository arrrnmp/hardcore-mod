org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Switchable Minecraft target (default 26.3). Pass -PmcVersion=26.2 to build all
# Fabric modules (client, game-server, limbo-server) against 26.2 instead -
# most third-party mods haven't updated to 26.3 yet. fabricApiVersion follows
# automatically (see gradle/libs.versions.toml) unless overridden with
# -PfabricApiVersion=... .
mcVersion=26.3

# Fabric Loom reads these mod metadata substitutions via ${version} placeholders
# in fabric.mod.json for the two server-side mods and the client mod.
mod_version=0.1.0-SNAPSHOT
maven_group=com.aaronmompie
